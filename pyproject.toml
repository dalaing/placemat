[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "placemat"
version = "0.1.0"
description = "Layout-aware benchmarking: tell a change's effect from code and data placement"
license = {text = "MIT"}
authors = [{name = "Dave Laing"}]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
placemat = "placemat.cli:main"

[tool.setuptools.packages.find]
include = ["placemat*"]

[tool.setuptools.package-data]
placemat = ["data/*.h", "data/*.c"]
